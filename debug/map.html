<!doctype html>
<html lang="en">
  <head>
    <title>Kernel Panic — M8 map builder</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="stylesheet" href="/main.css" type="text/css" />
    <style>
      .map-builder-shell {
        max-width: min(1120px, 100%);
        margin: 1rem auto;
        padding: 0 1rem;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      .map-builder-meta {
        margin: 0.75rem 0 0;
        font-size: 0.85rem;
        color: #8a9e98;
        word-break: break-all;
      }
      .map-builder-canvas {
        display: block;
        width: 100%;
        max-width: min(1120px, 100%);
        height: auto;
        background: #06090a;
        border: 1px solid #1a2422;
        border-radius: 6px;
        image-rendering: pixelated;
      }
      form {
        button {
          background-color: #00d9a5;
          color: #06090a;
          border: none;
          padding: 0.5rem 1rem;
          border-radius: 0.25rem;
          cursor: pointer;
          font-size: 1rem;
          font-weight: bold;
          text-transform: uppercase;

          &:hover,
          &:focus-visible {
            background-color: #00d9a57f !important;
            color: #eed5fa !important;
          }
        }
      }
    </style>
  </head>
  <body class="map-builder-shell">
    <header>
      <h1>Kernel Panic — M8 map builder</h1>
    </header>
    <main>
      <form id="map-builder-form">
        <label for="width">Width (min 20)</label>
        <input type="number" id="width" name="width" min="20" max="100" value="24" />
        <label for="height">Height (min 10)</label>
        <input type="number" id="height" name="height" min="10" max="100" value="16" />
        <label for="seed">Seed (u32, blank = random)</label>
        <input type="number" id="seed" name="seed" min="0" value="3735928559" />
        <label for="threatCount">Threats (drones)</label>
        <input type="number" id="threatCount" name="threatCount" min="0" max="12" value="2" />
        <button type="submit">Generate</button>
      </form>
      <p id="map-meta" class="map-builder-meta" aria-live="polite"></p>
      <canvas
        id="map-canvas"
        class="map-builder-canvas"
        width="640"
        height="400"
        tabindex="0"
        aria-label="Kernel Panic map visualization"
      ></canvas>
    </main>
    <script src="/debug/map.js" type="module"></script>
  </body>
</html>
