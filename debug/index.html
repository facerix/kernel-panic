<!doctype html>
<html lang="en">
  <head>
    <title>Kernel Panic — M2 debug</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="stylesheet" href="/main.css" type="text/css" />
    <style>
      .debug-shell {
        max-width: 720px;
        margin: 1rem auto;
        padding: 0 1rem;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      .debug-canvas {
        display: block;
        width: 100%;
        max-width: 640px;
        height: auto;
        background: #06090a;
        border: 1px solid #1a2422;
        border-radius: 6px;
        image-rendering: pixelated;
      }
      .debug-status {
        margin: 0.75rem 0;
        opacity: 0.85;
      }
      .debug-log {
        font-size: 0.9rem;
        background: #06090a;
        color: #6ee5c0;
        padding: 0.75rem;
        border-radius: 4px;
        max-height: 12rem;
        overflow-y: auto;
        white-space: pre-wrap;
      }
      kbd {
        background: #1a1e1d;
        border: 1px solid #2a2e2d;
        padding: 0 0.35em;
        border-radius: 3px;
        font-size: 0.9em;
      }
    </style>
  </head>
  <body class="debug-shell">
    <header>
      <h1>Kernel Panic — M2 debug</h1>
      <p>
        Canvas ASCII renderer + CRT post-pass over the M1 grid/turn engine.
        Glyphs: <code>@</code> player · <code>d</code> drone ·
        <code>#</code> wall · <code>+</code> cover · <code>.</code> floor.
      </p>
      <p>
        Move: <kbd>←↑↓→</kbd> orthogonal,
        <kbd>q</kbd> <kbd>e</kbd> <kbd>z</kbd> <kbd>c</kbd> diagonal.
        End turn: <kbd>space</kbd>. Wait: <kbd>.</kbd>. Reset: <kbd>r</kbd>.
      </p>
    </header>
    <main>
      <canvas
        id="game-canvas"
        class="debug-canvas"
        width="640"
        height="400"
        tabindex="0"
        aria-label="Kernel Panic game grid"
      ></canvas>
      <div id="status" class="debug-status" aria-live="polite"></div>
      <h2>Log</h2>
      <pre id="log" class="debug-log" aria-live="polite"></pre>
    </main>
    <script src="/debug/index.js" type="module"></script>
  </body>
</html>
