<!doctype html>

<html lang="en" xml:lang="en" xmlns="http://www.w3.org/1999/xhtml">
  <head>
    <title>Kernel Panic</title>
    <meta charset="utf-8" />
    <meta
      name="description"
      content="Turn-based cyberpunk roguelike — tactical grid combat in a terminal-inspired UI"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#00d9a5" />
    <link rel="canonical" href="https://kernel-panic.facerix.com/" />
    <meta property="og:title" content="Kernel Panic" />
    <meta
      property="og:description"
      content="Turn-based cyberpunk roguelike — tactical grid combat in a terminal-inspired UI"
    />
    <meta property="og:url" content="https://kernel-panic.facerix.com/" />
    <meta property="og:type" content="website" />
    <meta http-equiv="Content-Language" content="en" />

    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <link rel="stylesheet" href="/main.css" type="text/css" charset="utf-8" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="modulepreload" href="/index.js" />
  </head>

  <body class="u-fill-height">
    <header id="main-head">
      <img src="/icon.svg" width="40" height="40" alt="Kernel Panic logo" />
      <h1>Kernel Panic</h1>
      <button
        type="button"
        id="key-help-toggle"
        class="header-key-help-btn"
        aria-keyshortcuts="Shift+/"
        title="Keys (?)"
        aria-label="Show keyboard shortcuts"
      >
        ?
      </button>
    </header>
    <main class="game-shell u-fill-width u-flex u-flex-column">
      <div class="game-stage">
        <canvas
          id="game-canvas"
          width="640"
          height="400"
          tabindex="0"
          aria-label="Kernel Panic game view"
        ></canvas>
        <aside class="game-log collapsed">
          <h3>Log</h3>
          <pre id="log" aria-live="polite"></pre>
        </aside>
        <contract-select id="contract-select"></contract-select>
        <run-briefing id="briefing"></run-briefing>
        <crash-dump id="crash"></crash-dump>
        <system-start id="system-start"></system-start>
      </div>
      <p class="game-shell__status" id="game-status" aria-live="polite">Booting Meatspace…</p>
    </main>

    <footer id="main-foot"><a href="/about.html">GAME INFO</a></footer>

    <confirmation-modal id="resume-modal"></confirmation-modal>
    <confirmation-modal id="quit-campaign-modal"></confirmation-modal>
    <initial-recruit id="initial-recruit"></initial-recruit>
    <crew-roster id="crew-roster"></crew-roster>
    <finn-shop id="finn-shop"></finn-shop>
    <clinic-modal id="clinic-modal"></clinic-modal>
    <item-inventory id="item-inventory"></item-inventory>
    <key-help id="key-help"></key-help>
    <touch-pad id="touch-pad"></touch-pad>
    <update-notification></update-notification>
  </body>
  <script src="/index.js" type="module"></script>
</html>
